   function OTP(user, appName, otpKey) {

    const profile = profiles.find(profiles => 
        profiles.name === user && 
        profiles.app === appName && 
        profiles.otp === otpKey
    );


    const { name, app, otp } = profile;

    const msg = `Hello, ${name}. Your ${app} OTP is ${otp}. Please do not share it with anyone & it's valid for 30 min only.`;

    return msg;
}
